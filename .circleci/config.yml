version: 2.1

executors:
  docker-executor:
    docker:
      - image: cgr.dev/chainguard/bash:latest

jobs:
  check-directories:
    executor: docker-executor
    steps:
      - checkout
      - run:
          name: Hello World
          command: |
            echo "hello World"
      - run:
          name: List /usr directory
          command: |
            ls -l /usr > usr_contents.txt
      - run:
          name: List /usr/lib directory
          command: |
            ls -l /usr/lib > usr_lib_contents.txt
      - save_cache:
          key: directory-contents-{{ .Branch }}-{{ epoch }}
          paths:
            - usr_contents.txt
            - usr_lib_contents.txt
     # - approval:
     #     type: approval
     #     name: Approve to Finish

workflows:
  version: 2
  check_directories_and_approval:
    jobs:
      - check-directories
      - hold
