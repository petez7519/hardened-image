version: 2.1
jobs:
  build:
    docker:
      - image: cgr.dev/chainguard/bash
    resource_class: petez7519/undistro
    steps:
      - run: echo "Hi I'm a CVE 0 Container Runner!"
      - run:
        name: List /usr directory
        command: |
          ls -l /usr > usr_contents.txt
    - run:
        name: List /usr/lib directory
        command: |
          ls -l /usr/lib > usr_lib_contents.txt
    - run:
        name: Combine Directory Listings
        command: |
          cat usr_contents.txt usr_lib_contents.txt > combined_directory_contents.txt
workflows:
  build-workflow:
    jobs:
      - build
